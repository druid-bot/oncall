[project]
name = "oncall-worker"
version = "0.1.0"
description = "Daily clinic on-call reminders decoded from a Slack-uploaded schedule picture"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.20",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
